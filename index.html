<!DOCTYPE html>
<!--
  translate="no" + the "google" meta: the UI is localized at build time from
  src/i18n/*.json, so browser machine translation (Chrome/Safari "Translate
  page") must never run. It turned chords into words ("Am" → "Bin", "Fb" →
  "Facebook") and, by replacing React-owned text nodes, crashed the app to a
  blank screen. lang is kept in sync with the UI language by src/i18n/index.ts.
-->
<html lang="en" class="dark" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>ChordCrew</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
